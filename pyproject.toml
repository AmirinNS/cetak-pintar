[project]
name = "cetak_pintar"
version = "0.1.0"
description = "Printable A4 math and alphabet worksheets for Malaysian primary school kids, with answer keys. Web app and CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-limiter>=4.1.1",
    "python-dotenv>=1.0.0",
    "reportlab>=5.1.0",
    "waitress>=3.0.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.0.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
